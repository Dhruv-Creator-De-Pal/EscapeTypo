[package]
name = "Typer-Practice"
version = "0.1.0"
edition = "2024"

[dependencies]


lopdf = "0.46.0"
ratatui = "0.30.0"
crossterm = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
